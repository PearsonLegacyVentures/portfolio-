name: Publish portfolio form entries
on:
  issues:
    types: [opened, edited, reopened]
permissions:
  contents: write
  issues: read
concurrency:
  group: portfolio-entry-sync
  cancel-in-progress: false
jobs:
  sync:
    if: github.event.issue.user.login == github.repository_owner && (startsWith(github.event.issue.title, '[Portfolio]') || startsWith(github.event.issue.title, '[Media]'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Convert the issue form to a portfolio record
        run: python3 scripts/sync_issue.py
      - name: Commit new or updated entry
        run: |
          git config user.name "club1600-portfolio-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/entries.json
          if ! git diff --cached --quiet; then
            git commit -m "Portfolio: sync entry from issue #${{ github.event.issue.number }}"
            git push
          else
            echo "No changes to portfolio data."
          fi
